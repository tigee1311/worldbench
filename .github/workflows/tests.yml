name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[dev]"
      - name: Unit and offline integration tests
        run: python -m pytest --cov=worldbench --cov-branch --cov-report=term --cov-report=xml
      - name: Lint
        run: python -m ruff check .
      - name: Formatting
        run: python -m ruff format --check worldbench tests examples
      - name: Type check
        run: python -m mypy
      - name: Static security scan
        run: python -m bandit -q -c pyproject.toml -r worldbench --exclude worldbench/.venv
      - name: Dependency vulnerability scan
        run: python -m pip_audit --local --progress-spinner off

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip setuptools wheel build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel in clean virtual environment
        run: |
          python -m venv /tmp/worldbench-wheel
          /tmp/worldbench-wheel/bin/python -m pip install dist/*.whl
      - name: CLI smoke tests from built wheel
        run: |
          /tmp/worldbench-wheel/bin/worldbench --help
          /tmp/worldbench-wheel/bin/worldbench eval-video --help
          /tmp/worldbench-wheel/bin/worldbench eval-videos --help
          /tmp/worldbench-wheel/bin/worldbench eval-batch --help
          /tmp/worldbench-wheel/bin/worldbench gate --help
          /tmp/worldbench-wheel/bin/worldbench verify-run --help

  dependency-review:
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm run build
        working-directory: website
