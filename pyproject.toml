[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldbench"
version = "0.4.1"
description = "Regression testing for video-based robotics world models."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "WorldBench contributors" }
]
keywords = [
  "robotics",
  "world-models",
  "regression-testing",
  "checkpoint-regression",
  "video-prediction",
  "computer-vision",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy>=1.23",
  "pillow>=12.3",
  "pydantic>=2.0",
  "rich>=13.0",
  "click>=8.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
vision = ["scikit-image>=0.21"]
dev = [
  "bandit[toml]>=1.7",
  "build>=1.5",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "twine>=6.2",
]
video = ["imageio>=2.34", "imageio-ffmpeg>=0.5"]
lerobot = ["lerobot>=0.4.4"]

[project.urls]
Changelog = "https://github.com/tigee1311/worldbench/blob/main/CHANGELOG.md"
Documentation = "https://github.com/tigee1311/worldbench#readme"
Homepage = "https://github.com/tigee1311/worldbench"
Issues = "https://github.com/tigee1311/worldbench/issues"
Repository = "https://github.com/tigee1311/worldbench"

[project.scripts]
worldbench = "worldbench.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["worldbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
  "integration: downloads public LeRobot datasets from Hugging Face",
]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF100"]

[tool.coverage.run]
branch = true
source = ["worldbench"]
omit = [
  "worldbench/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.10"
files = [
  "worldbench/config.py",
  "worldbench/plugins.py",
  "worldbench/provenance.py",
  "worldbench/runners/comparator.py",
  "worldbench/runners/evaluator.py",
  "worldbench/runners/regression.py",
  "worldbench/schemas.py",
  "worldbench/statistics.py",
  "worldbench/verification.py",
]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[tool.bandit]
exclude_dirs = ["tests", "examples", "scripts", "website", ".venv", "worldbench/.venv", "build", "dist"]
skips = ["B101"]
